apiVersion: apps/v1
kind: Deployment
metadata:
  name: omm-webapp
  namespace: omm-project-14
spec:
  replicas: 2
  selector:
    matchLabels:
      app: omm-webapp
  template:
    metadata:
      labels:
        app: omm-webapp
    spec:
      imagePullSecrets:
        - name: ecr-registry-secret
      containers:
        - name: webapp
          image: 590507089733.dkr.ecr.eu-west-3.amazonaws.com/omm-project-13-webapp:2.0
          ports:
            - containerPort: 80
          imagePullPolicy: Always
