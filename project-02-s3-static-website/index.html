<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My AWS Static Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            color: #1f2937;
            text-align: center;
            padding: 80px 20px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            padding: 40px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.08);
        }

        h1 {
            color: #e87500;
        }

        .success {
            color: #15803d;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hello from Amazon S3!</h1>
        <p class="success">Static website deployed successfully.</p>
        <p>This website is hosted on Amazon S3 using Terraform.</p>
        <p>Infrastructure as Code | AWS | Terraform</p>
    </div>
</body>
</html>
