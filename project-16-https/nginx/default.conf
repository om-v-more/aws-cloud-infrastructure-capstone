server {
    listen 443 ssl;
    server_name omm-project-16.local;

    ssl_certificate /etc/nginx/certs/omm-selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/omm-selfsigned.key;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 80 default_server;
    server_name _;

    return 403;
}
