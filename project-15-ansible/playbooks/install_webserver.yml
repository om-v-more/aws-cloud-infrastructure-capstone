---
- name: Install and configure Nginx web server
  hosts: managed
  become: true

  tasks:
    - name: Update package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install Nginx
      ansible.builtin.apt:
        name: nginx
        state: present

    - name: Start Nginx
      ansible.builtin.command: nginx
      args:
        creates: /run/nginx.pid
